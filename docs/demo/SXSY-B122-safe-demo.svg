<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f2f4f7"/>
<style>.title{font:700 42px Arial,sans-serif;fill:#111827}.warning{font:700 23px Arial,sans-serif;fill:#b91c1c}.step{font:700 20px Arial,sans-serif;fill:#111827}.chord{font:700 30px Consolas,monospace;fill:#111827}.action{font:20px Consolas,monospace;fill:#374151}.message{font:19px Arial,sans-serif;color:#111827;line-height:1.25}</style>
<text x="70" y="72" class="title">SXSY-B122 deterministic fail-closed demo</text>
<text x="70" y="118" class="warning">SIMULATED - NO HARDWARE OR PROVIDER EVIDENCE</text>
<text x="70" y="158" class="action">Fixed fixture target; zero network, credentials, Git mutation, or acceptance evidence.</text>
<rect x="70" y="210" width="680" height="230" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="6"/><text x="100" y="258" class="step">STEP 1 - PREVIEW</text><text x="100" y="304" class="chord">PROOF:normal</text><text x="100" y="345" class="action">Action: proof</text><foreignObject x="100" y="362" width="620" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="message">Read-only proof packet is bound to one simulated exact target.</div></foreignObject>
<rect x="820" y="210" width="680" height="230" rx="18" fill="#ffffff" stroke="#6b7280" stroke-width="6"/><text x="850" y="258" class="step">STEP 2 - UNAVAILABLE</text><text x="850" y="304" class="chord">PROOF:normal</text><text x="850" y="345" class="action">Action: proof</text><foreignObject x="850" y="362" width="620" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="message">No attested provider is installed; no provider request is sent.</div></foreignObject>
<rect x="70" y="510" width="680" height="230" rx="18" fill="#ffffff" stroke="#b91c1c" stroke-width="6"/><text x="100" y="558" class="step">STEP 3 - BLOCKED</text><text x="100" y="604" class="chord">COMMIT:alt</text><text x="100" y="645" class="action">Action: pr_merge</text><foreignObject x="100" y="662" width="620" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="message">Exact-head merge is blocked because required gates are NOT ACCEPTED.</div></foreignObject>
<rect x="820" y="510" width="680" height="230" rx="18" fill="#ffffff" stroke="#166534" stroke-width="6"/><text x="850" y="558" class="step">STEP 4 - PRESERVED</text><text x="850" y="604" class="chord">PIPELINE:normal</text><text x="850" y="645" class="action">Action: pipeline_status</text><foreignObject x="850" y="662" width="620" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="message">Typed outcomes remain visible; no external effect or retry occurred.</div></foreignObject>
<text x="70" y="855" class="warning">Every acceptance gate remains NOT ACCEPTED.</text>
</svg>
