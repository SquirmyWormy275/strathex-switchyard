name: Build the exact Windows state helper

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision the existing digest-pinned offline toolchain
        shell: pwsh
        run: .\deployment\windows\Provision-B122DotnetToolchain.ps1
      - name: Verify the standalone provider helper before the source matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = '.\apps\windows-companion\provider-desktop-helper\Sxsy.B122.ProviderDesktopHelper.csproj'
          $output = Join-Path $env:RUNNER_TEMP 'switchyard-provider-helper-check'
          & .\.tools\dotnet\dotnet.exe restore $project -r win-x64 --source .\.tools\nuget-feed --packages .\.tools\nuget-packages --configfile .\.tools\NuGet.Config -p:RuntimeFrameworkVersion=8.0.30
          if ($LASTEXITCODE -ne 0) { throw 'Standalone provider helper offline restore failed.' }
          & .\.tools\dotnet\dotnet.exe publish $project --no-restore -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=8.0.30 -p:UseSharedCompilation=false -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Standalone provider helper compilation failed.' }
          $exe = Join-Path $output 'sxsy-b122-provider-desktop-helper.exe'
          $proof = & $exe --self-test | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $proof.schema -cne 'sxsy-b122.provider-desktop-self-test' -or $proof.version -ne 1 -or $proof.status -cne 'ok' -or $proof.currentProcessVerified -ne $true -or $proof.ownerQueryVerified -ne $true -or $proof.focusOnlyPolicyVerified -ne $true -or $proof.nativeEditorPolicyVerified -ne $true -or $proof.tokenAccessMask -ne 8 -or $proof.windowFocused -ne $false) { throw 'Standalone provider helper native self-test failed.' }
          $receipt = @{ schema='switchyard-provider-helper-preflight/v1'; source=$env:GITHUB_SHA; sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant(); bytes=(Get-Item -LiteralPath $exe).Length; selfTestVerified=$true; tokenAccessMask=8; windowFocused=$false }
          Write-Host ('SXSY-PROVIDER-HELPER-PREFLIGHT ' + ($receipt | ConvertTo-Json -Compress))
      - name: Compile the same helper shipped in Windows releases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = '.\apps\desktop-hotkeys\Switchyard.Hotkeys.csproj'
          $output = Join-Path $env:RUNNER_TEMP 'switchyard-state-helper'
          & .\.tools\dotnet\dotnet.exe restore $project -r win-x64 --source .\.tools\nuget-feed --packages .\.tools\nuget-packages --configfile .\.tools\NuGet.Config -p:RuntimeFrameworkVersion=8.0.30
          if ($LASTEXITCODE -ne 0) { throw 'State helper offline restore failed.' }
          & .\.tools\dotnet\dotnet.exe publish $project --no-restore -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=8.0.30 -o $output
          if ($LASTEXITCODE -ne 0) { throw 'State helper compilation failed.' }
          $exe = Join-Path $output 'Switchyard.Hotkeys.exe'
          @{ schema='switchyard-state-helper-build/v1'; source=$env:GITHUB_SHA; sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant(); bytes=(Get-Item -LiteralPath $exe).Length } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'build.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: switchyard-state-helper-${{ github.sha }}
          path: |
            ${{ runner.temp }}/switchyard-state-helper/Switchyard.Hotkeys.exe
            ${{ runner.temp }}/switchyard-state-helper/build.json
          if-no-files-found: error
          retention-days: 1
