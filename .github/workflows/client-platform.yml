name: Switchyard client platform checks

on:
  pull_request:
    paths:
      - '.github/workflows/client-platform.yml'
      - '.github/workflows/switchyard-windows-state-helper.yml'
      - '.github/actions/install-state-helper/**'
      - 'integrations/**'
      - 'apps/desktop-hotkeys/**'
      - 'apps/windows-companion/provider-desktop-helper/**'
      - 'apps/vscode-extension/**'
      - 'apps/windows-companion/src/repository-runtime.ts'
      - 'apps/windows-companion/src/repository-inputs.ts'
      - 'apps/windows-companion/test/repository-runtime.test.ts'
      - 'tools/layout-studio/**'
      - 'scripts/verify-client-platform.mjs'
      - 'scripts/copy-vscode-runtime.mjs'
      - 'scripts/vscode-windows-runtime*'
      - 'scripts/run-isolated-tests.mjs'
      - 'deployment/suite/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchyard-client-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-state-helper:
    uses: ./.github/workflows/switchyard-windows-state-helper.yml

  verify-client-platform:
    needs: build-state-helper
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_update_notifier: 'false'
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install pinned standard-library test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.3
      - name: Install locked source dependencies
        run: npm.cmd ci --ignore-scripts

      - name: Install the exact-source native state helper
        uses: ./.github/actions/install-state-helper
      - name: Verify native WinRT metadata and bounded client contracts without launching a URI
        run: node scripts/verify-client-platform.mjs
      - name: Retain bounded verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: switchyard-client-platform-${{ github.sha }}
          path: .sxsy-verification/isolated-test-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
