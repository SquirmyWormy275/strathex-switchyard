name: B122 Windows release verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b122-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_RUNTIME_VERSION: 24.14.0
      NODE_RUNTIME_SHA256: 313fa40c0d7b18575821de8cb17483031fe07d95de5994f6f435f3b345f85c66
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NUGET_XMLDOC_MODE: skip
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.424

      - name: Install locked JavaScript dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts

      - name: Fetch and verify the official portable Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "node-v$env:NODE_RUNTIME_VERSION-win-x64.zip"
          $uri = "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION/node-v$env:NODE_RUNTIME_VERSION-win-x64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:NODE_RUNTIME_SHA256) { throw "The official Node runtime digest did not match the reviewed value: $actual" }
          "NODE_RUNTIME_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODE_RUNTIME_URI=$uri" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify the complete Windows bundle
        shell: pwsh
        run: |
          .\deployment\windows\Build-B122Release.ps1 `
            -NodeRuntimeZip $env:NODE_RUNTIME_ARCHIVE `
            -NodeRuntimeSha256 $env:NODE_RUNTIME_SHA256 `
            -NodeRuntimeSourceUri $env:NODE_RUNTIME_URI

      - name: Prove generated source remains canonical
        shell: pwsh
        run: git diff --exit-code
